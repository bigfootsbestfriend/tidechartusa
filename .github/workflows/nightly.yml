name: Nightly NOAA refresh and deploy

on:
  schedule:
    - cron: "17 7 * * *"   # daily 07:17 UTC (about 3 AM Eastern), before most people check tides
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Predictions aren't committed (they change every day); each run downloads a fresh month.
      # If more than 5% of stations fail, fetch.py exits non-zero and yesterday's site stays up.
      # Code-only pushes reuse the last full download (predictions start yesterday and run a month ahead),
      # so a change goes live in a few minutes instead of waiting ~40 for NOAA.
      - name: Reuse the last NOAA download (pushes only)
        id: data
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: noaa-data-none
          restore-keys: noaa-data-
      - name: Download NOAA predictions
        if: steps.data.outputs.cache-matched-key == ''
        run: python3 collector/fetch.py --workers 3
      # Currents, live-sensor lists, marine forecast zones and buoys. Optional: if it fails,
      # pages are built without those sections.
      - name: Download currents and marine extras
        if: steps.data.outputs.cache-matched-key == ''
        run: python3 collector/extras.py
        continue-on-error: true
      # Full-year predictions for the "<year> tide table" pages (from yearly.yml). Optional.
      - name: Restore yearly tide tables data
        uses: actions/cache/restore@v4
        with:
          path: data/year
          key: year-data-none
          restore-keys: year-data-
      - name: Build site
        run: python3 site/build.py
        env:
          SITE_URL: https://shorebite.com
          ALERTS_API: https://alerts.shorebite.com
          GA_ID: G-5PFNWYW3ES
      - name: Keep this download for code-only pushes
        if: steps.data.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: |
            data
            !data/year
          key: noaa-data-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
